# Sized for a small single host shared with the backend (see
# backend/docker-compose.prod.yml for the host-level memory budget). Build the
# image OFF the host (CI or a dev machine) and set FRONTEND_IMAGE to pull it:
# `next build` needs far more RAM than the running server does.
services:
  frontend:
    # Default is the name Compose already gives this build (project
    # "frontend", service "frontend"); override to pull a prebuilt image.
    image: ${FRONTEND_IMAGE:-frontend-frontend}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        # NEXT_PUBLIC_* are baked into the client bundle at build time.
        # Compose pulls these from the host environment / .env file.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL}
    container_name: ecommerce_frontend
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: ${INTERNAL_API_URL}
      # PORT/HOSTNAME are already set in the Dockerfile but kept here so
      # changing them does NOT need a rebuild.
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # glibc's per-core malloc arenas fragment RSS upward over days with
      # native modules (sharp, used by the image optimizer). Two arenas keep
      # the resident size flat for a negligible throughput cost.
      MALLOC_ARENA_MAX: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEM_LIMIT:-512m}
    # Rotate container logs so a long-running host doesn't fill its disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

