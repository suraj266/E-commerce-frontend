type Cart {
  createdAt: DateTime!

  """
  Owning customer. Null for a guest cart (keyed by an httpOnly sessionToken cookie instead).
  """
  customerId: ID
  id: ID!

  """Sum of quantity across all items — drives the header badge."""
  itemCount: Int!
  items: [CartItem!]!

  """true if any line has a price change OR is out of stock."""
  needsReview: Boolean!

  """Sum of all lineTotal values. Tax + shipping computed at checkout."""
  subtotal: Float!
  updatedAt: DateTime!
}

type CartItem {
  """Aggregate available stock across warehouses. -1 if unknown/unbounded."""
  availableQuantity: Int!
  cartId: ID!
  createdAt: DateTime!
  id: ID!

  """quantity * unitPriceCurrent — what the line costs today (pre-tax)."""
  lineTotal: Float!

  """
  true when unitPriceCurrent != unitPriceSnapshot — the customer should re-confirm before checkout.
  """
  priceChanged: Boolean!
  product: Product
  productId: ID!
  quantity: Int!

  """Stock state for this variant: IN_STOCK | LOW_STOCK | OUT_OF_STOCK."""
  stockState: String!

  """
  GST portion for the whole line (unit tax × quantity). Null if the product has no tax. Display-only; checkout recomputes authoritatively.
  """
  taxAmount: Float

  """Live price right now (variant.price)."""
  unitPriceCurrent: Float!

  """
  Price of the variant at the time it was added to the cart. Compare with `unitPriceCurrent` to detect price drift.
  """
  unitPriceSnapshot: Float!
  updatedAt: DateTime!
  variant: ProductVariant
  variantId: ID!
}

type CartValidationResult {
  """true when there are zero warnings — safe to proceed."""
  valid: Boolean!

  """One entry per (variant, issue). Empty when valid."""
  warnings: [CartWarning!]!
}

type CartWarning {
  """Live available stock across warehouses (stock-related codes)."""
  availableQuantity: Int

  """OUT_OF_STOCK | REDUCED_QUANTITY | PRICE_CHANGED | UNAVAILABLE."""
  code: String!

  """Human-readable, display-ready explanation."""
  message: String!

  """Current live price (PRICE_CHANGED only)."""
  newPrice: Float

  """Snapshot price at add time (PRICE_CHANGED only)."""
  oldPrice: Float

  """
  Quantity the customer could keep instead (= availableQuantity for REDUCED_QUANTITY).
  """
  suggestedQuantity: Int

  """Variant the warning is about."""
  variantId: ID!
}

